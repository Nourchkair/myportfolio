<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="none" role="img" aria-label="n8n workflow and CRM dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1319"/>
      <stop offset="1" stop-color="#080c10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6d5a"/>
      <stop offset="1" stop-color="#e0aa62"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#24313a"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- n8n workflow canvas -->
  <g>
    <rect x="0" y="0" width="1000" height="1000" fill="#0b1117"/>
    <rect x="0" y="0" width="1000" height="1000" fill="url(#dots)" opacity=".75"/>
    <rect x="0" y="0" width="1000" height="82" fill="#0f171e"/>
    <circle cx="40" cy="41" r="9" fill="#ff6d5a"/>
    <text x="65" y="53" fill="#e9f0f3" font-family="ui-monospace,Menlo,monospace" font-size="26" letter-spacing="2">WORKFLOW / OPS</text>
    <rect x="827" y="24" width="130" height="36" rx="18" fill="#1b262d" stroke="#2e3d46"/>
    <circle cx="849" cy="42" r="5" fill="#7be0b6"/>
    <text x="865" y="50" fill="#a6b7be" font-family="ui-monospace,Menlo,monospace" font-size="18">LIVE</text>

    <g stroke="#2b3b45" stroke-width="2" stroke-dasharray="5 5" opacity=".6">
      <path d="M0 230H1000M0 330H1000M0 430H1000M0 530H1000M0 630H1000M0 730H1000M0 830H1000"/>
      <path d="M180 80V1000M380 80V1000M580 80V1000M780 80V1000M980 80V1000"/>
    </g>

    <!-- connections -->
    <g fill="none" stroke-linecap="round">
      <path d="M255 320 C310 320 315 230 375 230" stroke="#ff6d5a" stroke-width="4" opacity=".8"/>
      <path d="M255 320 C310 320 315 430 375 430" stroke="#9fe2f2" stroke-width="4" opacity=".6"/>
      <path d="M560 230 C625 230 635 300 700 300" stroke="#ff6d5a" stroke-width="4" opacity=".75"/>
      <path d="M560 430 C630 430 640 520 700 520" stroke="#9fe2f2" stroke-width="4" opacity=".55"/>
      <path d="M855 300 C900 300 910 410 925 410" stroke="#e0aa62" stroke-width="4" opacity=".7"/>
    </g>

    <!-- webhook node -->
    <g>
      <rect x="60" y="270" width="200" height="102" rx="16" fill="#141e25" stroke="#394852"/>
      <rect x="60" y="270" width="6" height="102" rx="3" fill="#ff6d5a"/>
      <text x="88" y="310" fill="#f4f7f8" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="600">Webhook</text>
      <text x="88" y="344" fill="#7f949d" font-family="ui-monospace,Menlo,monospace" font-size="20">POST /lead</text>
      <circle cx="252" cy="321" r="7" fill="#ff6d5a" filter="url(#glow)"/>
    </g>

    <!-- filter + enrich -->
    <g>
      <rect x="375" y="180" width="185" height="100" rx="16" fill="#141e25" stroke="#ff6d5a" stroke-width="2"/>
      <text x="403" y="220" fill="#f4f7f8" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="600">Filter</text>
      <text x="403" y="253" fill="#7f949d" font-family="ui-monospace,Menlo,monospace" font-size="18">score &gt; 40</text>
      <rect x="375" y="380" width="185" height="100" rx="16" fill="#141e25" stroke="#394852"/>
      <text x="403" y="420" fill="#f4f7f8" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="600">Enrich</text>
      <text x="403" y="452" fill="#7f949d" font-family="ui-monospace,Menlo,monospace" font-size="18">company · owner</text>
    </g>

    <!-- crm + notify nodes -->
    <g>
      <rect x="700" y="245" width="210" height="112" rx="16" fill="#182028" stroke="#e0aa62" stroke-width="2"/>
      <circle cx="734" cy="282" r="10" fill="#e0aa62" filter="url(#glow)"/>
      <text x="758" y="292" fill="#f4f7f8" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="600">CRM</text>
      <text x="730" y="330" fill="#93a5ad" font-family="ui-monospace,Menlo,monospace" font-size="18">upsert contact</text>
      <rect x="700" y="468" width="210" height="105" rx="16" fill="#141e25" stroke="#394852"/>
      <text x="730" y="508" fill="#f4f7f8" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="600">Notify</text>
      <text x="730" y="541" fill="#7f949d" font-family="ui-monospace,Menlo,monospace" font-size="18">Slack · #sales</text>
      <rect x="790" y="630" width="140" height="40" rx="20" fill="#0f1b20" stroke="#2d3b43"/>
      <text x="812" y="658" fill="#9fe2f2" font-family="ui-monospace,Menlo,monospace" font-size="19">+ ADD STEP</text>
    </g>
  </g>

  <!-- CRM dashboard -->
  <g>
    <rect x="1000" y="0" width="600" height="1000" fill="#10171d"/>
    <rect x="1000" y="0" width="600" height="1000" fill="url(#dots)" opacity=".22"/>
    <text x="1035" y="55" fill="#e9f0f3" font-family="ui-monospace,Menlo,monospace" font-size="22" letter-spacing="1.5">CRM / PIPELINE</text>
    <circle cx="1550" cy="42" r="10" fill="#9fe2f2" opacity=".7"/>
    <text x="1035" y="108" fill="#81969f" font-family="Helvetica,Arial,sans-serif" font-size="19">Qualified revenue</text>
    <text x="1035" y="166" fill="#fff6e6" font-family="Helvetica,Arial,sans-serif" font-size="64" font-weight="600">$184k</text>
    <rect x="1035" y="194" width="150" height="30" rx="15" fill="#173025"/>
    <text x="1052" y="215" fill="#7be0b6" font-family="ui-monospace,Menlo,monospace" font-size="16">+ 18.4%</text>

    <line x1="1035" y1="255" x2="1565" y2="255" stroke="#28363e" stroke-width="1.5"/>

    <!-- chart -->
    <g>
      <text x="1035" y="295" fill="#81969f" font-family="Helvetica,Arial,sans-serif" font-size="17">Pipeline by week</text>
      <g fill="#26343d">
        <rect x="1040" y="470" width="42" height="95" rx="7"/>
        <rect x="1100" y="420" width="42" height="145" rx="7"/>
        <rect x="1160" y="450" width="42" height="115" rx="7"/>
        <rect x="1220" y="365" width="42" height="200" rx="7"/>
        <rect x="1280" y="390" width="42" height="175" rx="7"/>
        <rect x="1340" y="320" width="42" height="245" rx="7"/>
        <rect x="1400" y="350" width="42" height="215" rx="7"/>
        <rect x="1460" y="290" width="42" height="275" rx="7"/>
      </g>
      <g fill="#e0aa62">
        <rect x="1040" y="530" width="42" height="35" rx="7"/>
        <rect x="1100" y="515" width="42" height="50" rx="7"/>
        <rect x="1160" y="500" width="42" height="65" rx="7"/>
        <rect x="1220" y="470" width="42" height="95" rx="7"/>
        <rect x="1280" y="445" width="42" height="120" rx="7"/>
        <rect x="1340" y="430" width="42" height="135" rx="7"/>
        <rect x="1400" y="400" width="42" height="165" rx="7"/>
        <rect x="1460" y="390" width="42" height="175" rx="7"/>
      </g>
    </g>

    <line x1="1035" y1="610" x2="1565" y2="610" stroke="#28363e" stroke-width="1.5"/>
    <text x="1035" y="650" fill="#81969f" font-family="Helvetica,Arial,sans-serif" font-size="17">Latest opportunities</text>
    <g font-family="Helvetica,Arial,sans-serif" font-size="19">
      <circle cx="1048" cy="690" r="7" fill="#ff6d5a"/>
      <text x="1070" y="697" fill="#e9f0f3">TrackIt / renewal</text>
      <text x="1515" y="697" fill="#e0aa62" text-anchor="end">$12.4k</text>
      <circle cx="1048" cy="740" r="7" fill="#9fe2f2"/>
      <text x="1070" y="747" fill="#e9f0f3">Safiy / team plan</text>
      <text x="1515" y="747" fill="#e0aa62" text-anchor="end">$8.8k</text>
      <circle cx="1048" cy="790" r="7" fill="#7be0b6"/>
      <text x="1070" y="797" fill="#e9f0f3">Academia / campus</text>
      <text x="1515" y="797" fill="#e0aa62" text-anchor="end">$6.2k</text>
      <circle cx="1048" cy="840" r="7" fill="#c9a7ff"/>
      <text x="1070" y="847" fill="#e9f0f3">AFunTime / launch</text>
      <text x="1515" y="847" fill="#e0aa62" text-anchor="end">$4.1k</text>
    </g>
    <rect x="1035" y="900" width="530" height="48" rx="24" fill="#172129" stroke="#2b3a43"/>
    <text x="1060" y="930" fill="#9fe2f2" font-family="ui-monospace,Menlo,monospace" font-size="16">VIEW FULL PIPELINE →</text>
  </g>
</svg>

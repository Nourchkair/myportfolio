name = "ai-nour-production"
main = "src/index.js"
compatibility_date = "2026-11-26"
workers_dev = false

routes = [
  { pattern = "api.nourchkair.com", custom_domain = true }
]

[triggers]
crons = ["*/10 * * * *"]

[vars]
APP_ENV = "production"
TEXT_PROVIDER = "gemini"
LIVE_PROVIDER = "gemini"
TEXT_MODEL = "gemini-flash-lite-latest"
LIVE_MODEL = "gemini-3.8-live"
LIVE_VOICE = "Aoede"
BETA_ACCESS_REQUIRED = "true"
LIVE_TOKEN_RESERVATION_USD_MICROS = "80000"
LIVE_TOKEN_RESERVATION_PER_MINUTE_USD_MICROS = "25000"
LIVE_SESSION_SECONDS = "600"
MAX_LIVE_SESSION_SECONDS = "600"
LIVE_TOKEN_NEW_SESSION_TTL_SECONDS = "60"
LIVE_TOKEN_HOLD_SECONDS = "900"
MAX_LIVE_TOKENS_PER_DAY = "12"
DAILY_SPEND_CAP_USD_MICROS = "1000000"
CUMULATIVE_SPEND_CAP_USD_MICROS = "7000000"
TEXT_INPUT_USD_PER_MILLION = "0.10"
TEXT_OUTPUT_USD_PER_MILLION = "0.40"
LIVE_TEXT_INPUT_USD_PER_MILLION = "0.75"
LIVE_AUDIO_INPUT_USD_PER_MILLION = "3.00"
LIVE_AUDIO_OUTPUT_USD_PER_MILLION = "12.00"
RATE_LIMIT_WINDOW_SECONDS = "600"
CHAT_RATE_LIMIT = "30"
LIVE_RATE_LIMIT = "12"
MAX_MESSAGE_CHARS = "2000"
MAX_HISTORY_MESSAGES = "16"
SUMMARY_TRIGGER_MESSAGES = "20"
ADMIN_ENABLED = "true"
ALLOWED_ORIGINS = "https://nourchkair.com,https://www.nourchkair.com,https://nourchkair.pages.dev"
ENABLE_CRM_WRITES = "false"
CALENDAR_INVITES_ENABLED = "true"
CRM_SHEETS_SYNC_ENABLED = "true"
EMAIL_PROVIDER = "resend"
EMAIL_SEND_ENABLED = "false"
EMAIL_MAX_ATTEMPTS = "5"
EMAIL_RETRY_BASE_SECONDS = "60"
RESEND_FROM = "AI Nour <appointments@mail.nourchkair.com>"

[[d1_databases]]
binding = "DB"
database_name = "ai-nour-production"
database_id = "a1fa8975-2a79-4b56-b96e-ecf814eeaa02"
migrations_dir = "migrations"

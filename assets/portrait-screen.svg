<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Portrait placeholder">
  <defs>
    <radialGradient id="bgGlow" cx="42%" cy="32%" r="72%">
      <stop offset="0" stop-color="#6f5b47"/>
      <stop offset=".48" stop-color="#2c2a28"/>
      <stop offset="1" stop-color="#111515"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d6a2" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#d4a46b" stop-opacity=".34"/>
      <stop offset="1" stop-color="#d4a46b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30383a"/>
      <stop offset=".62" stop-color="#171e21"/>
      <stop offset="1" stop-color="#0b1012"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#71543f"/>
      <stop offset=".52" stop-color="#3c2b23"/>
      <stop offset="1" stop-color="#181312"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="softSmall" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#bgGlow)"/>
  <g filter="url(#soft)" opacity=".55">
    <circle cx="160" cy="150" r="100" fill="#c89256" opacity=".23"/>

  <path d="M348 263c0-84 46-139 102-139s102 55 102 139c0 23-4 43-12 61-20-6-34-23-40-48-17 28-48 44-84 44-22 0-41-5-55-14-9-13-13-27-13-43Z" fill="#171311"/>

  <path d="M335 420c-45 33-70 91-76 180" fill="none" stroke="url(#rim)" stroke-width="3" opacity=".3"/>
  <path d="M561 430c43 33 66 91 72 170" fill="none" stroke="#78979a" stroke-width="2" opacity=".22"/>
  <circle cx="594" cy="270" r="12" fill="#5d4434" opacity=".6"/>


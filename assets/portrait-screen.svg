    <circle cx="810" cy="420" r="160" fill="#0c1214" opacity=".55"/>
    <rect x="0" y="420" width="900" height="180" fill="#111617" opacity=".62"/>
  </g>
  <g filter="url(#softSmall)" opacity=".5">
    <circle cx="705" cy="260" r="14" fill="#e0b47a" opacity=".6"/>
    <circle cx="748" cy="240" r="8" fill="#e0b47a" opacity=".4"/>
    <circle cx="132" cy="318" r="10" fill="#d3ab77" opacity=".32"/>
  </g>

  <ellipse cx="450" cy="535" rx="285" ry="58" fill="#05090a" opacity=".32"/>
